<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Carrito de compras">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playwrite+NZ+Guides&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!--css bootstrap-->   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- custom css-->
    <link rel="stylesheet" href="../css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script defer src="../js/clases.js"></script>
    <script defer src="../js/funciones.js"></script>
    <script defer src="../js/main.js"></script>

    <link rel="icon" href="../Images/favicon.svg" type="image/x-icon">
    <title>Carrito de Compras</title>
</head>
<body id="checkout">
    <nav class="navbar navbar-expand-lg sticky-top" style="background-color: #18233f;" data-bs-theme="dark"> 
        <div class="container-fluid barranav">
            <a class="navbar-brand" href="../index.html">
                <img src="../Images/favicon.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Carrito de Compras
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="../index.html">Inicio</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="pass.html">Administracion</a>
                </li>   
            </ul>
            </div>
        </div>
    </nav>
    <div class="ppal-checkout" id="ppal-checkout">
        <div class="zona-form" id="zona-form">
            <div class="form">
                <h2 class="form__title">Completa los datos</h2>
                <form class="form__form" id="contactoForm">
                    <div class="form__input-container">
                        <label for="nombre">Nombre</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Tu nombre"
                            required>
                    </div>
                    <div class="form__input-container">
                        <label for="apellido">Apellido</label>
                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Tu apellido"
                            required>
                    </div>
                    <div class="form__input-container">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="tu@email.com"
                            required>
                    </div>
                    <div class="form__input-container">
                        <label for="direccion">
                            Dirección de envío
                        </label>
                        <input
                            type="text"
                            id="direccion"
                            name="direccion"
                            placeholder="Calle, número, localidad"
                            required>
                    </div>
                    <div class="form__input-container">
                        <label for="mpago">
                            Método de pago
                        </label>
                        <select id="mpago" name="mpago" required>
                            <option value="">
                                Seleccione una opción
                            </option>
                            <option value="credito">
                                Tarjeta de crédito
                            </option>
                            <option value="debito">
                                Tarjeta de débito
                            </option>
                            <option value="transferencia">
                                Transferencia bancaria
                            </option>
                            <option value="mercadopago">
                                Mercado Pago
                            </option>
                        </select>
                    </div>
                    <div class="form__input-container">
                        <button type="submit" class="btn btn-primary btn-confirmar">
                            Confirmar compra
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <aside class="zonaCarrito">
            <h5>Carrito de compras</h5>
            <div class="contenedor-carrito" id="contenedor-carrito">
            </div>
        </aside>
    </div>
    <footer><strong>Marcelo Alejandro Barroso</strong> Copyright</footer>
</body>
</html>
