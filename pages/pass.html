<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Carrito de compras">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playwrite+NZ+Guides&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!--css bootstrap-->   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- custom css-->
    <link rel="stylesheet" href="../css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script defer src="../js/clases.js"></script>
    <script defer src="../js/funciones.js"></script>
    <script defer src="../js/main.js"></script>

    <link rel="icon" href="../Images/favicon.svg" type="image/x-icon">
    <title>Carrito de Compras</title>
  </head>
<body id="pass">
    <nav class="navbar navbar-expand-lg sticky-top" style="background-color: #18233f;" data-bs-theme="dark"> 
        <div class="container-fluid barranav">
            <a class="navbar-brand" href="../index.html">
                <img src="../Images/favicon.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Carrito de Compras
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="../index.html">Inicio</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="pass.html">Administracion</a>
                </li>   
            </ul>
            </div>
        </div>
    </nav>
    <main>     
        <div class="login-page">
            <div class="login-card">
                <h1 class="login-title">
                    Iniciar Sesión
                </h1>
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="usuario">
                            Usuario
                        </label>
                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Ingrese su usuario"
                            required>
                    </div>
                    <div class="form-group">
                        <label for="password">
                            Contraseña
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingrese su contraseña"
                            required>
                    </div>
                    <button 
                        type="submit" 
                        class="btn btn-primary btn-final" data-bs-toggle="modal" data-bs-target="#modalDenegado">
                        Ingresar
                    </button>
                </form>
            </div>
            <div class="modal fade" id="modalDenegado" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">      
                        <div class="modal-header">
                            <h5 class="modal-title">Acceso denegado</h5>
                        </div>
                        <div class="modal-body">
                            Verifica el usuario o la contraseña
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
                                Aceptar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>Marcelo Barroso CopyRight</footer>
</body>
</html>
